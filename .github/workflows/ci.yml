name: CI

on:
  pull_request:
  push:
    branches: [main]

# Lightweight gate: type-check + fast unit tests for both applications.
# The Storybook/Playwright browser tests and the build step are intentionally
# out of this gate for now.
#
# One workspace means one lockfile, so every job installs from the root and
# shares a single npm cache key; work is then targeted with `--workspace`.
jobs:
  web:
    name: Web — typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @quick-tweets/web
      - run: npm run test --workspace @quick-tweets/web

  api:
    name: API — typecheck + unit tests
    runs-on: ubuntu-latest
    env:
      # Placeholder — `prisma generate` reads the schema but does not connect to a
      # database, so no real DATABASE_URL is needed to generate the client.
      DATABASE_URL: "postgresql://user:password@localhost:5432/quick_tweets?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @quick-tweets/api # generate the Prisma client (gitignored; required to type-check)
      - run: npm run typecheck --workspace @quick-tweets/api
      - run: npm run test --workspace @quick-tweets/api
