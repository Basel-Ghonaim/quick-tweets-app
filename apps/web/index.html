<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quick-tweets</title>
    <meta name="theme-color" content="#fafafe" />

    <!--
      Runs before the first paint, which is the whole point: anything in the
      module graph runs after the browser has already painted, so a reader who
      prefers dark would see a white frame on every load (Finding 0018).

      It reads the same two sources the provider does, in the same order, and
      validates against the same closed set - the stored value is a bare string
      precisely so this can understand it without sharing any code.
    -->
    <script>
      (function () {
        var THEMES = { light: "#fafafe", dark: "#171424" };
        var stored = null;
        try {
          stored = localStorage.getItem("quick-tweets:theme");
        } catch (error) {
          /* Unreadable storage is not a reason to fail to paint. */
        }
        var theme =
          stored in THEMES
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", THEMES[theme]);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
