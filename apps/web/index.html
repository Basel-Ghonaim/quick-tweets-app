<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quick-tweets</title>
    <meta name="theme-color" content="#fafafe" />

    <!-- Runs before the first paint, which nothing in the module graph can do:
         a reader who prefers dark would otherwise see a white frame on every
         load (Finding 0018). It resolves as the provider does, and a check
         holds the two to that. -->
    <script>
      (function () {
        var THEMES = { light: "#fafafe", dark: "#171424" };
        var stored = null;
        try {
          stored = localStorage.getItem("quick-tweets:theme");
        } catch (error) {
          /* Unreadable storage is not a reason to fail to paint. */
        }
        var theme =
          stored in THEMES
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", THEMES[theme]);
      })();
    </script>
    <!-- The language and its direction, settled before the first paint so a page
         never turns around after it is drawn. A check holds this to the module. -->
    <script>
      (function () {
        var LANGUAGES = ["en"];
        var RIGHT_TO_LEFT = ["ar"];
        var FALLBACK = "en";
        var stored = null;
        try {
          stored = localStorage.getItem("quick-tweets:language");
        } catch (error) {
          /* Unreadable storage is not a reason to fail to paint. */
        }
        var browser =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language];
        var language = FALLBACK;
        if (stored !== null && LANGUAGES.indexOf(stored) !== -1) {
          language = stored;
        } else {
          for (var i = 0; i < browser.length; i++) {
            var base = String(browser[i]).toLowerCase().split("-")[0];
            if (LANGUAGES.indexOf(base) !== -1) {
              language = base;
              break;
            }
          }
        }
        document.documentElement.setAttribute("lang", language);
        document.documentElement.setAttribute(
          "dir",
          RIGHT_TO_LEFT.indexOf(language) !== -1 ? "rtl" : "ltr",
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
